<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LIORA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="splash">

        <div class="splash-container premium-splash">
                <audio id="splash-audio" src="https://cdn.pixabay.com/audio/2022/10/16/audio_12b5b1b6b2.mp3" preload="auto"></audio>
                <div class="splash-logo-wrapper">
                        <img src="liora.png" alt="LIORA Logo" class="splash-logo large-logo">
                        <div class="splash-brand">LIORA</div>
                </div>
                <div class="splash-tagline">Luxury Redefined</div>
        </div>
        <script>
            // Play sound and restart animation on every load
            window.addEventListener('DOMContentLoaded', function() {
                const audio = document.getElementById('splash-audio');
                if (audio) {
                    audio.currentTime = 0;
                    audio.play();
                }
                // Restart animation
                const logo = document.querySelector('.splash-logo');
                if (logo) {
                    logo.classList.remove('splashFadeIn');
                    void logo.offsetWidth; // trigger reflow
                    logo.classList.add('splashFadeIn');
                }
            });
        </script>

    <script src="script.js"></script>
</body>

</html>
